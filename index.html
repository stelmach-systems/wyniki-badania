<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wyniki badania</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<style>
/* jedna karta z hasłem na środku kolumny; po odszyfrowaniu stronę zastępuje dashboard */
:root{--tlo:#f6f6f4;--karta:#fff;--tekst:#1f2328;--mut:#5f6670;--linia:#d5d7da;--akcent:#2f3a45;--na-akcencie:#fff;--blad:#a3261c;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tlo:#17181a;--karta:#222428;--tekst:#e6e7e9;--mut:#a0a5ad;
 --linia:#3a3d42;--akcent:#d9dde2;--na-akcencie:#17181a;--blad:#f08a80;color-scheme:dark}}
:root[data-theme="dark"]{--tlo:#17181a;--karta:#222428;--tekst:#e6e7e9;--mut:#a0a5ad;--linia:#3a3d42;--akcent:#d9dde2;
 --na-akcencie:#17181a;--blad:#f08a80;color-scheme:dark}
body{background:var(--tlo);color:var(--tekst);font:16px/1.5 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));
 padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12vh 32px}
form{max-width:400px;margin:0 auto;display:grid;gap:12px;background:var(--karta);border:1px solid var(--linia);border-radius:10px;padding:20px}
h1{font-size:1.25rem;margin:0;text-wrap:balance}
p{margin:0;color:var(--mut);font-size:.9375rem}
label{font-weight:600;font-size:.875rem}
input{font:16px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.04em;padding:12px;border:1px solid var(--linia);border-radius:8px;
 background:var(--tlo);color:var(--tekst);width:100%;box-sizing:border-box}
button{font:600 16px var(--font);padding:12px;border:0;border-radius:8px;background:var(--akcent);color:var(--na-akcencie);cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--akcent);outline-offset:2px}
#stan{min-height:1.5em;color:var(--mut)}#stan.blad{color:var(--blad)}
</style>
<form id="zamek">
<h1>Wyniki badania</h1>
<p>Strona jest zaszyfrowana. Wpisz hasło, żeby ją otworzyć — odszyfrowanie dzieje się tylko w tym telefonie.</p>
<label for="haslo">Hasło</label>
<input id="haslo" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off"
 spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx" required>
<button id="otworz">Otwórz</button>
<p id="stan" role="status"></p>
</form>
